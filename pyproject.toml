[project]
name = "shadow-250m-instruct"
version = "0.1.0"
description = "Local inference and fine-tuning environment for SHADOW 250M Instruct"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets>=3.0,<5",
    "huggingface-hub>=0.27,<2",
    "numpy>=1.26,<3",
    "sentencepiece>=0.2,<1",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
tilelang = [
    "tilelang==0.1.13",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
